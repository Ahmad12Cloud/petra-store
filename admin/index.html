let ppDrag=null,ppIgnoreClickBefore=0;
function ppBindBuilderDrag(){
 const stage=$('pp-builder-stage');if(!stage||stage.dataset.pointerBound)return;
 stage.dataset.pointerBound='1';
 stage.addEventListener('pointerdown',e=>{
  if(!visibleAdmin()||e.button>0)return;
  const cell=e.target.closest('.pp-builder-cell');if(!cell)return;
  const canvas=$('pp-builder-canvas');if(!canvas||!canvas.contains(cell))return;
  const i=+cell.dataset.index,b=state.settings.companyLayout.blocks[i];if(!b)return;
  e.preventDefault();e.stopPropagation();builderSelected=i;
  canvas.querySelectorAll('.pp-builder-cell').forEach(el=>el.classList.toggle('selected',el===cell));
  builderInspectorRefresh();
  const rect=canvas.getBoundingClientRect();
  ppDrag={pointerId:e.pointerId,cell,index:i,canvas,startX:e.clientX,startY:e.clientY,
   x:b.posX||0,y:b.posY||0,w:b.widthValue,h:b.height,unit:b.widthUnit,
   resize:!!e.target.closest('.pp-free-resize'),moved:false,rect};
  try{stage.setPointerCapture(e.pointerId)}catch{}
 },{passive:false});
 stage.addEventListener('pointermove',e=>{
  const d=ppDrag;if(!d||d.pointerId!==e.pointerId)return;
  e.preventDefault();const dx=e.clientX-d.startX,dy=e.clientY-d.startY;
  if(Math.abs(dx)+Math.abs(dy)>3)d.moved=true;
  const b=state.settings.companyLayout.blocks[d.index];if(!b)return;
  if(d.resize){
   const wpx=(d.unit==='px'?d.w:d.w/100*d.rect.width)-dx;
   const clamped=Math.max(40,Math.min(wpx,d.rect.width*(1-(d.x/100))));
   b.widthValue=d.unit==='px'?Math.round(clamped):Math.round(clamped/d.rect.width*1000)/10;
   b.height=Math.max(28,Math.min(800,Math.round(d.h+dy)));
   d.cell.style.width=b.widthValue+d.unit;d.cell.style.height=b.height+'px';
  }else{
   const sizepct=d.unit==='px'?d.w/d.rect.width*100:d.w;
   b.posX=Math.round(Math.max(0,Math.min(100-sizepct,d.x-dx/d.rect.width*100))*10)/10;
   b.posY=Math.round(Math.max(0,Math.min(2400,d.y+dy)));
   d.cell.style.right=b.posX+'%';d.cell.style.top=b.posY+'px';
  }
 },{passive:false});
 const finish=e=>{
  const d=ppDrag;if(!d||d.pointerId!==e.pointerId)return;
  ppDrag=null;
  if(d.moved){ppIgnoreClickBefore=Date.now()+450;builderAutoSave();}
  builderCanvasRefresh();builderInspectorRefresh();
  try{stage.releasePointerCapture(e.pointerId)}catch{}
 };
 stage.addEventListener('pointerup',finish);stage.addEventListener('pointercancel',finish);
 stage.addEventListener('click',e=>{if(Date.now()<ppIgnoreClickBefore&&e.target.closest('.pp-builder-cell')){e.preventDefault();e.stopPropagation();}},true);
}

const searchable=(p)=>normalizeSearch([p.sku,p.productCode,p.barcode,p.nameAr,p.nameEn,p.category,p.brand,p.model,p.specs,p.descriptionAr,p.descriptionEn].join(' '));
const ALIASES={breaker:['breaker','mcb','mccb','قاطع','قواطع'],mcb:['mcb','قاطع','قواطع','breaker'],mccb:['mccb','قاطع','قواطع','breaker'],fuse:['fuse','fuses','فيوز','فيوزات'],inverter:['inverter','انفرتر','انفرترات'],battery:['battery','بطاريه','بطاريات'],قاطع:['قاطع','قواطع','mcb','mccb','breaker'],فيوز:['فيوز','فيوزات','fuse','fuses'],انفرتر:['انفرتر','انفرترات','inverter']};
const list=()=>{const terms=normalizeSearch(q).split(' ').filter(Boolean);return state.products.filter(p=>p.active&&(!ppOnlyNew||ppIsNew(p))&&(!cat||p.category===cat)&&(!onlyStock||p.stock==null||p.stock>0)&&(!terms.length||terms.every(term=>(ALIASES[term]||[term]).some(alt=>searchable(p).includes(alt))))).sort((a,b)=>order==='az'?S(a.nameAr,a.nameEn).localeCompare(S(b.nameAr,b.nameEn),'ar'):order==='price-low'?(a.price??Infinity)-(b.price??Infinity):order==='price-high'?(b.price??-1)-(a.price??-1):order==='old'?(a.createdAt||0)-(b.createdAt||0):(b.createdAt||0)-(a.createdAt||0));};
const allCategories=()=>[...new Set([...state.settings.categories,...state.products.map(p=>p.category)])].filter(Boolean);

// 100% local product recommendations: never call an AI service and never add products to cart without a click.
const RECO_BASE_RULES={
 'قواطع كهربائية':['لوحات وتحكم','إكسسوارات'],
 'قواطع DC':['إكسسوارات','فيوزات DC','لوحات وتحكم'],
 'فيوزات DC':['قواطع DC','إكسسوارات'],
 'كونتاكتورات وريليات':['لوحات وتحكم','إكسسوارات'],
 'انفرترات':['قواطع DC','بطاريات ليثيوم','إكسسوارات'],
 'بطاريات ليثيوم':['قواطع DC','انفرترات','إكسسوارات'],
 'لوحات وتحكم':['كونتاكتورات وريليات','قواطع كهربائية','إكسسوارات'],
 'إكسسوارات':['قواطع كهربائية','قواطع DC','لوحات وتحكم']
};
const recoMode=()=>['off','manual','auto'].includes(state.settings.recommendationMode)?state.settings.recommendationMode:'off';
function rulesForCategory(category){
 const raw=clean(state.settings.recommendationRules);
 const rules={...RECO_BASE_RULES};
 if(raw)for(const line of raw.split(/\r?\n/)){
  const parts=line.split(/\s*(?:=>|→|:)\s*/);
  if(parts.length>=2&&clean(parts[0]))rules[clean(parts[0])]=parts.slice(1).join(':').split(/[,،]/).map(clean).filter(Boolean).slice(0,15);
 }
 return Object.entries(rules).find(([k])=>normalizeSearch(k)===normalizeSearch(category))?.[1]||[];
}
function recommendedFor(p,excludeIds=[]){
 if(!p||recoMode()==='off')return [];
 const exclude=new Set([p.id,...excludeIds]);
 if(recoMode()==='manual')return (p.relatedIds||[]).map(id=>state.products.find(x=>x.id===id)).filter(x=>x&&x.active&&!exclude.has(x.id)).slice(0,6);
 const target=rulesForCategory(p.category).map(normalizeSearch);
 const candidates=state.products.filter(x=>x.active&&!exclude.has(x.id));
 return candidates.filter(x=>target.includes(normalizeSearch(x.category))).sort((a,b)=>{
  const ca=target.indexOf(normalizeSearch(a.category)),cb=target.indexOf(normalizeSearch(b.category));
  return ca-cb || (Number(b.stock!==0)-Number(a.stock!==0)) || S(a.nameAr,a.nameEn).localeCompare(S(b.nameAr,b.nameEn),'ar');
 }).slice(0,6);
}
function recoItemsHtml(items){return `<div class="reco-grid">${items.map(p=>`<div class="reco-item"><div class="reco-photo">${photo(p)}</div><div class="reco-info"><strong>${esc(S(p.nameAr,p.nameEn))}</strong><small>${money(p.price,p.currency)}</small><button type="button" class="btn dark" data-action="add-cart" data-id="${esc(p.id)}">＋ ${T('أضف للطلب','Add to order')}</button></div></div>`).join('')}</div>`}
function recommendationsHtml(p){const items=recommendedFor(p);if(!items.length)return '';return `<div class="reco-panel"><div class="reco-title">✨ ${T('قد تحتاج أيضاً','You might also need')}</div><div class="smallnote">${recoMode()==='manual'?T('ملحقات اختارتها إدارة Petra Power','Accessories chosen by Petra Power'):T('اقتراحات من فئات منتجات مرتبطة','Suggestions based on related product categories')}</div>${recoItemsHtml(items)}<p class="smallnote" style="margin-bottom:0">${T('تأكد من توافق المواصفات قبل الشراء. لا يضاف أي منتج للطلب إلا باختيارك.','Check technical compatibility before purchase. Nothing is added unless you choose it.')}</p></div>`}
function cartRecommendations(){if(recoMode()==='off'||!cart.length)return '';const chosen=new Set(cart.map(x=>x.id));const ids=new Set(),items=[];for(const item of cart){const p=state.products.find(x=>x.id===item.id);for(const rec of recommendedFor(p,[...chosen]))if(!ids.has(rec.id)){ids.add(rec.id);items.push(rec)}}if(!items.length)return '';return `<div class="reco-panel"><div class="reco-title">✨ ${T('مقترحات مكملة لطلبك','Suggested additions to your order')}</div>${recoItemsHtml(items.slice(0,6))}<p class="smallnote">${T('اقتراحات اختيارية وليست ضماناً للتوافق الكهربائي.','Optional suggestions, not a guarantee of electrical compatibility.')}</p></div>`}
function recoModeControl(){const mode=recoMode();const labels=[['off',T('إيقاف','Off')],['manual',T('يدوي','Manual')],['auto',T('تلقائي','Automatic')]];return `<div class="reco-panel"><div class="reco-title">✨ ${T('توصيات المنتجات للزبائن','Product recommendations for customers')}</div><p class="smallnote">${T('اختر وضعاً واحداً للتجربة. الوضع اليدوي يستخدم المنتجات التي تربطها بنفسك؛ والتلقائي يستخدم فئات البضاعة الموجودة، دون ذكاء اصطناعي خارجي.','Select one test mode. Manual uses product links you choose; automatic uses existing product categories. No external AI.')}</p><div class="reco-switch">${labels.map(([k,v])=>`<button class="btn ${mode===k?'selected':''}" data-action="set-reco-mode" data-mode="${k}" type="button">${mode===k?'✓ ':''}${v}</button>`).join('')}</div><p class="smallnote">${mode==='off'?T('التوصيات متوقفة حالياً.','Recommendations are currently disabled.'):mode==='manual'?T('اختَر «تعديل» لأي منتج ثم حدّد المنتجات المكملة له.','Select Edit on a product, then choose its suggested accessories.'):T('ستظهر المنتجات من الفئات المترابطة، إن كانت موجودة بالكتالوج. يمكنك تعديل قواعد الفئات من الإعدادات.','Products from related categories will appear when available. Edit category rules in Settings.')}</p></div>`}
function renderRelatedPicker(){
 const sel=$('related-selected'),results=$('related-results');if(!sel||!results)return;
 const chosen=formRelatedIds.map(x=>state.products.find(p=>p.id===x)).filter(Boolean);
 sel.innerHTML=chosen.map(p=>`<span class="reco-chip">${esc(S(p.nameAr,p.nameEn))}<button type="button" data-action="toggle-related" data-id="${esc(p.id)}" aria-label="Remove">×</button></span>`).join('')||`<span class="smallnote">${T('لم تختَر أي منتج بعد.','No products selected yet.')}</span>`;
 const search=normalizeSearch($('related-search')?.value||'');
 const items=state.products.filter(p=>p.id!==editId&&(!search||searchable(p).includes(search))).slice(0,18);
 results.innerHTML=`<div class="reco-pick">${items.map(p=>`<button type="button" class="${formRelatedIds.includes(p.id)?'picked':''}" data-action="toggle-related" data-id="${esc(p.id)}">${formRelatedIds.includes(p.id)?'✓ ':''}${esc(S(p.nameAr,p.nameEn))} <span class="smallnote">${esc(p.sku)}</span></button>`).join('')}</div>${!items.length?`<p class="smallnote">${T('أضف منتجات ثانية أولاً حتى تربطها.','Add other products first to link them.')}</p>`:''}`;
}

function pp24Products(sec){

 const used=new Set();
 const previous=(state.settings.homeSections||[]);
 for(const row of previous){
  if(row.id===sec.id)break;
  if(row.visible===false||!['products','new'].includes(row.type))continue;
  const pool=available(row);
  const chosen=Array.isArray(row.productIds)&&row.productIds.length
   ?row.productIds.map(id=>pool.find(p=>p.id===id)).filter(Boolean).slice(0,count(row))

const SMART_CONCEPTS=[
 ['breaker','قاطع','قواطع','قواطع كهربائيه','mcb','mccb','circuit breaker','breakers','ديجونكتور','ديجونتر'],
 ['wifi','wi fi','واي فاي','وايفاي','واي فاي','سمارت','smart','wireless','ذكي'],
 ['inverter','انفرتر','انفيرتر','انفرتير','انفرترات','انفرترز','عاكس'],
 ['battery','بطاريه','بطاريات','ليثيوم','lifepo4','lithium'],
 ['fuse','فيوز','فيوزات','فيوزات dc','مصهر','fuses'],
 ['contactor','كونتاكتور','كونتاكتورات','contactors'],
 ['relay','ريليه','ريليات','relays','relay'],
 ['solar','طاقه شمسيه','شمسي','solar','pv','الواح','لوح'],
 ['din','din rail','سكه','سكة','rail'],
 ['cable','كابل','كابلات','اسلاك','سلك','wire','cables'],
 ['panel','علبه توزيع','علبة توزيع','لوحه','لوحه تحكم','لوحات','enclosure','distribution box']
];
const SMART_STOP=new Set(['بدي','اريد','ابحث','بحث','عن','عندي','عندكم','عندكن','عندك','في','هل','يوجد','عطيني','اعطيني','جيب','شوي','من','شو','عندك','بدي','بديك','محتاج','عايز','بشوف','شراء','ممكن','please','want','need','show','me','a','the','an','for','do','you','have','i','looking']);
function searchProductsSmart(userText){
 const query=normalizeSearch(userText),remaining=new Set(query.split(' ').filter(w=>w&&!SMART_STOP.has(w)&&w.length>1));
 const concepts=[];
 for(const group of SMART_CONCEPTS){
  const options=group.map(normalizeSearch);
  const found=options.some(x=>x&&(' '+query+' ').includes(' '+x+' '));
  if(found){concepts.push(options);for(const x of options)if((' '+query+' ').includes(' '+x+' '))for(const word of x.split(' '))remaining.delete(word)}
 }
 const words=[...remaining];const results=[];
 for(const p of state.products){if(!p.active)continue;const hay=searchable(p);const title=normalizeSearch([p.nameAr,p.nameEn,p.model,p.sku].join(' '));let hits=0;let score=0;
  for(const opts of concepts){if(opts.some(k=>k&&(' '+hay+' ').includes(' '+k+' '))){hits++;score+=8}else if(opts.some(k=>k&&hay.includes(k))){hits++;score+=6}}
  for(const word of words){if(hay.includes(word)){hits++;score+=title.includes(word)?5:2}}
  if(query&&title.includes(query))score+=16;
  if(score>0)results.push({p,score,hits});
 }
 const required=concepts.length+words.length;
 results.sort((a,b)=>b.score-a.score||Number(b.p.stock!==0)-Number(a.p.stock!==0));
 const exact=required>0&&results.some(r=>r.hits>=required);
 return {matches:results.slice(0,12).map(x=>x.p),exact};
}

let pp33ResizeObserver=null;
function pp33SliderSettings(){return state.settings.homeSections?.find(x=>x.type==='slider'&&x.visible!==false)||{};}
function pp33RefreshSlide(){
 const stage=document.querySelector('#hero-carousel .banner-image-stage');if(!stage)return;
 const img=stage.querySelector('img.banner-image');if(!img)return;
 const sec=pp33SliderSettings(),mode=['smart','cover','contain','fullwidth','screen'].includes(sec.imageFit)?sec.imageFit:'smart';
 const iw=img.naturalWidth||0,ih=img.naturalHeight||0;
 const fw=stage.clientWidth||1;
 // Height zero means responsive to the uploaded image's aspect ratio.
 // Explicit owner height wins, while the auto mode is capped for small screens.
 const preferred=iw&&ih?Math.max(165,Math.min(490,Math.round(fw*ih/iw))):200;
 const root=document.getElementById('hero-carousel');
 const fullHeight=iw&&ih?Math.max(80,Math.min(4000,Math.round(fw*ih/iw))):Math.max(200,fw*1.6);
 const screenHeight=Math.max(200,Math.min(1600,Math.round(window.innerHeight-Math.max(0,root?.getBoundingClientRect().top||0)-4)));
 const compactHeight=Number(state.settings.sliderCompactHeight)||0;
 const effective=compactHeight>0?Math.max(85,Math.min(650,compactHeight)):mode==='fullwidth'?fullHeight:mode==='screen'?screenHeight:Number(sec.height)>0?Math.max(80,Math.min(1600,Number(sec.height))):preferred;
 if(root&&root.style.getPropertyValue('--pp33-effective-height')!==effective+'px')root.style.setProperty('--pp33-effective-height',effective+'px');
 const fh=effective;
 const delta=(iw&&ih)?Math.max((iw/ih)/(fw/fh),(fw/fh)/(iw/ih)):1;
 const contain=compactHeight>0?(state.settings.sliderCompactFit==='contain'):mode==='contain'||mode==='fullwidth'||(mode==='smart'&&delta>1.5);
 stage.classList.toggle('pp33-contain',contain);
 stage.classList.toggle('pp33-cover',!contain);
 stage.classList.toggle('pp33-backdrop-blur',contain&&sec.backdropMode!=='solid');
 stage.dataset.fitResolved=contain?'contain':'cover';
 const holder=root?.closest('.pp24-slider-unit');if(holder){const requested=Number(sec.pp34WidthMode==='px'?100:(sec.pp34WidthValue??sec.width??100));holder.classList.toggle('pp37-edge',(mode==='fullwidth'||mode==='screen')&&requested>=100);}
 root?.setAttribute('data-pp37-mode',compactHeight>0?'compact':mode);
}
function pp33WatchSlide(){
 try{pp33ResizeObserver?.disconnect();}catch(e){}
 const stage=document.querySelector('#hero-carousel .banner-image-stage');if(!stage)return;
 const img=stage.querySelector('img.banner-image');
 if(img){img.addEventListener('load',pp33RefreshSlide,{once:true});if(img.complete&&img.naturalWidth)pp33RefreshSlide();}
 if(typeof ResizeObserver!=='undefined'){
  pp33ResizeObserver=new ResizeObserver(()=>pp33RefreshSlide());pp33ResizeObserver.observe(stage);
 }
}

async function importFullOwnerFile(file){if(!file)return;if(file.size>150000000)throw Error('Large file');const txt=await file.text();const m=txt.match(/<script\s+id=["']embedded-data["']\s+type=["']application\/json["']>([\s\S]*?)<\/script>/i);if(!m)throw Error('Not a Petra Power owner file');const incoming=normalize(JSON.parse(m[1]));if(!Array.isArray(incoming.products)||!incoming.settings)throw Error('Invalid data');if(!incoming.products.length){note(T('هذا الملف ليس فيه منتجات قابلة للنقل','Selected owner file contains no products'));return;}
const known=new Set(state.products.flatMap(p=>[p.id,'sku:'+clean(p.sku).toLowerCase()]));const extra=incoming.products.filter(p=>!known.has(p.id)&&(!p.sku||!known.has('sku:'+clean(p.sku).toLowerCase())));
const available=12-(state.settings.banners||[]).length;const bknown=new Set((state.settings.banners||[]).map(b=>b.id));const moreBanners=(incoming.settings.banners||[]).filter(b=>!bknown.has(b.id)).slice(0,Math.max(0,available));
if(!extra.length&&!moreBanners.length){note(T('كل المنتجات وصور الواجهة الموجودة بهذا الملف موجودة أصلاً؛ ما تغيّر شي.','Nothing new in this file. Existing items were preserved.'));return;}
if(!confirm(T(`سيتم إضافة ${extra.length} منتج و${moreBanners.length} صورة واجهة فقط. لن تتغير المنتجات أو الأسعار أو إعدادات التصميم الموجودة. متابعة؟`,`Add ${extra.length} missing products and ${moreBanners.length} banners. Current items and design remain unchanged. Continue?`)))return;
exportJSON();state.products.push(...extra);state.settings.banners.push(...moreBanners);await changed();start();goto('catalog');note(T('تم نقل العناصر الجديدة فقط، دون استبدال المنتجات أو إعدادات التصميم. احفظ نسخة عند الانتهاء.','Only missing items added; current catalog and design preserved. Save owner copy before exiting.'));}
function pickFullOwner(){const input=document.createElement('input');input.type='file';input.accept='.html,text/html';input.onchange=async()=>{const f=input.files?.[0];if(!f)return;try{await importFullOwnerFile(f)}catch(e){alert(T('تعذر نقل البيانات: ','Could not transfer data: ')+e.message)}};input.click();}

function pp35GridCols(sec){const conf=pp35GridConfig();if(conf.mode==='list')return 1;if(sec?.pp49Manual)return Math.round(pp35Limit(sec.pp49Cols,1,8,2));return Math.round(pp35Limit(sec?.customColumns||conf.cols,1,5,2));}

/* V45 — Independent row widths (preserved in V46). A row may contain 1, 2, 3, 4 or 5 products;
   row-start overrides are stored on the individual product, not tied to its position. */
function pp45ParsePattern(value){return String(Array.isArray(value)?value.join(','):(value||''))
 .split(/[\s,،;|\-]+/).map(Number).filter(n=>Number.isInteger(n)&&n>=1&&n<=8).slice(0,100);}
function pp45ProductCols(p){const n=Number(p?.pp45RowCols)||0;return Number.isInteger(n)&&n>=1&&n<=5?n:0;}
function pp45Mixed(prods,sec){return pp35GridConfig().mode!=='list'&&
  (pp45ParsePattern(sec?.pp45RowPattern).length>0||prods.some(p=>pp45ProductCols(p)>0));}
function pp45BuildRows(prods,sec){
 const pattern=pp45ParsePattern(sec?.pp45RowPattern),defaultCols=pp35GridCols(sec);
 const rows=[];let current=null,idx=0;
 for(const p of prods){const own=pp45ProductCols(p);
  if(!current||current.products.length>=current.columns||own){
   const count=own||(idx<pattern.length?pattern[idx]:defaultCols);
   current={columns:Math.max(1,Math.min(8,count)),products:[]};rows.push(current);idx++;
  }
  current.products.push(p);
 }
 return rows;
}
function pp45ProductHtml(prods,sec){
 const gap=pp35GridConfig().gap;
 return pp45BuildRows(prods,sec).map((r,index)=>
   `<div class="pp45-product-row" data-pp45-row="${index+1}" data-pp45-cols="${r.columns}" style="grid-template-columns:repeat(${r.columns},minmax(${r.columns>5?96:0}px,1fr));gap:${gap}px;${r.columns>5?'overflow-x:auto;':''}">${r.products.map(productCard).join('')}</div>`).join('');
}
function pp45GridMarkup(prods,sec){return pp45Mixed(prods,sec)?pp45ProductHtml(prods,sec):prods.map(productCard).join('');}

/* V44 — human-readable automatic product code; SKU remains an internal stable identifier. */
function pp44NewCode(){
 let mx=0;
 for(const p of state.products){
   const code=String(p.productCode||p.sku||'');
   const m=code.match(/^PP-(\d+)$/i);
   if(m)mx=Math.max(mx,Number(m[1]));
 }
 return 'PP-'+String(mx+1).padStart(4,'0');
}
function pp44Flag(p,key){
 if(!p || !p.visibility || typeof p.visibility!=='object')return key==='showCode'?false:true;
 return p.visibility[key]!==false && (key!=='showCode'||p.visibility[key]===true);
}
function pp44VisibilityFor(p,key){
 if(p && p.visibility && Object.prototype.hasOwnProperty.call(p.visibility,key))return p.visibility[key]===true;
 if(key==='showCode')return false;
 if(!p && (key==='showCategory'||key==='showBrandModel'||key==='showSpecs'))return false;
 return true;
}
function pp44VisibilityCheckbox(p,key,label){return `<label><input type="checkbox" name="${key}" ${pp44VisibilityFor(p,key)?'checked':''}>${label}</label>`;}

function compressImage(f,max){return new Promise((resolve,reject)=>{if(!f.type.startsWith('image/'))return reject(Error('اختَر صورة JPG أو PNG أو WEBP'));if(f.size>12*1024*1024)return reject(Error('الصورة أكبر من 12MB'));const reader=new FileReader();reader.onerror=()=>reject(Error('تعذر قراءة الصورة'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(Error('نوع الصورة غير مدعوم'));img.onload=()=>{let w=img.width,h=img.height;if(!w||!h)return reject(Error('الصورة غير صالحة'));const ratio=Math.min(1,max/Math.max(w,h));w=Math.max(1,Math.round(w*ratio));h=Math.max(1,Math.round(h*ratio));const can=document.createElement('canvas');can.width=w;can.height=h;const ctx=can.getContext('2d');if(!ctx)return reject(Error('تعذر معالجة الصورة'));ctx.drawImage(img,0,0,w,h);let result=can.toDataURL('image/webp',.69);if(!result.startsWith('data:image/webp'))result=can.toDataURL('image/jpeg',.72);resolve(result)};img.src=reader.result};reader.readAsDataURL(f)})}

// V38: Explicit, verified local checkpoint. This does not download a file or
// overwrite the HTML in Android Downloads; it stores data for this browser origin.
async function pp38SaveLocalSettings(){
 if(!MANAGER||!visibleAdmin()){note('افتح وضع المالك أولاً.');return false;}
 try{
  const persisted=await changed();
  if(!persisted)throw new Error('متصفح الهاتف منع التخزين المحلي');
  const cached=await loadDB();
  if(!cached||Number(cached.lastEdited)!==Number(state.lastEdited)||
      !Array.isArray(cached.products)||cached.products.length!==state.products.length||
      JSON.stringify(cached.settings)!==JSON.stringify(state.settings)){
   throw new Error('تعذّر التحقق من قراءة البيانات المحفوظة');
  }
  pp38LocalSavedStamp=state.lastEdited;
  pp38LocalSaveVerified=true;
  localSaveFailed=false;
  updateSaveStatus();
  const at=new Date().toLocaleTimeString('ar-LB',{hour:'2-digit',minute:'2-digit'});
  note('✅ حفظ الإعدادات نجح على هذا المتصفح ('+at+'). لم يُنزّل أي ملف. زر «حفظ نسخة كاملة» للتنزيل لاحقاً.');
  return true;
 }catch(err){
  pp38LocalSaveVerified=false;
  localSaveFailed=true;
  updateSaveStatus();
  note('⚠️ ما انحفظت الإعدادات بشكل موثوق: '+String(err?.message||err)+'. حمّل «نسخة كاملة» قبل إغلاق الملف.');
  return false;
 }
}
const DBNAME=document.documentElement.dataset.demo==='true'?'petrapower-v7-demo':'petrapower-v7-owner';
function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window))return reject(Error('No IndexedDB'));let req=indexedDB.open(DBNAME,1);req.onupgradeneeded=()=>req.result.createObjectStore('files');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function loadDB(){
 if(!MANAGER)return null;
 let local=null,remote=null;
 try{local=JSON.parse(localStorage.getItem(DBNAME+'-fallback')||'null')}catch(e){}
 try{
  db=await openDB();
  remote=await new Promise((resolve,reject)=>{
   const r=db.transaction('files','readonly').objectStore('files').get('owner-state');
   r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error);
  });
 }catch(e){}
 return Number(remote?.lastEdited||0)>=Number(local?.lastEdited||0)?remote:local;

function exportCSV(){const keys=['sku','barcode','nameAr','nameEn','category','brand','model','price','currency','stock','specs','descriptionAr','descriptionEn','active'];const rows=[keys.join(','),...state.products.map(p=>keys.map(k=>quoteCSV(p[k]??'')).join(','))];dl('\ufeff'+rows.join('\r\n'),'PetraPower-Products.csv','text/csv;charset=utf-8')}
function csvRows(text){let rows=[],row=[],item='',quote=false;for(let i=0;i<text.length;i++){const c=text[i];if(quote){if(c==='"'&&text[i+1]==='"'){item+='"';i++}else if(c==='"')quote=false;else item+=c}else if(c==='"')quote=true;else if(c===','){row.push(item);item=''}else if(c==='\n'){row.push(item.replace(/\r$/,''));rows.push(row);row=[];item=''}else item+=c}if(quote)throw Error('Incomplete CSV quote');if(item||row.length){row.push(item);rows.push(row)}return rows}
async function importCSV(file){
 const rows=csvRows((await file.text()).replace(/^\ufeff/,''));
 if(rows.length<2)throw Error('CSV has no data');
 const head=rows.shift().map(x=>clean(x));
 if(!head.includes('sku')||(!head.includes('nameAr')&&!head.includes('nameEn')))throw Error('Required columns: sku and nameAr or nameEn');
 if(rows.length>10000)throw Error('Too many rows');
 const seen=new Set(state.products.map(x=>clean(x.sku).toLowerCase()).filter(Boolean));
 const fresh=[];
 for(const row of rows){
   if(row.every(x=>!clean(x)))continue;
   const item=Object.fromEntries(head.map((k,i)=>[k,clean(row[i])]));
   if(!item.sku||!(item.nameAr||item.nameEn))throw Error('Missing SKU/name');
   if(seen.has(item.sku.toLowerCase()))continue;
   if(item.price&&(!Number.isFinite(+item.price)||+item.price<0))throw Error('Invalid price');
   if(item.stock&&!/^\d+$/.test(item.stock))throw Error('Invalid stock');
   seen.add(item.sku.toLowerCase());
   fresh.push({...item,id:id(),createdAt:Date.now(),price:item.price===''?null:Number(item.price||0),stock:item.stock===''?null:Number(item.stock||0),currency:item.currency||'USD',images:[],active:true});
 }
 if(!fresh.length){alert(T('ما في منتجات جديدة للاستيراد. المنتجات الموجودة بقيت بدون أي تغيير.','No new products. Existing records stay unchanged.'));return;}
 if(!confirm(T(`إضافة ${fresh.length} منتج جديد فقط؟ المنتجات الحالية وأسعارها وصورها لن تتغير.`,`Add ${fresh.length} new products only? Existing products will not be changed.`)))return;
 state.products.push(...fresh);
 for(const p of fresh){if(p.category&&!state.settings.categories.includes(p.category))state.settings.categories.push(p.category)}
 await changed();render();note(T('تمت إضافة المنتجات الجديدة فقط','Only new products were added'));
}
async function restoreData(raw){
 if(raw.backupType!=='PETRA_POWER_OFFLINE_CATALOG'&&!Array.isArray(raw.products))throw Error('Invalid backup');
 if(!Array.isArray(raw.products)||!raw.settings)throw Error('Missing data');
 if(raw.products.length>10000)throw Error('Too many products');
 const incoming=normalize(raw);
 const seen=new Set(state.products.map(p=>clean(p.sku).toLowerCase()).filter(Boolean));
 const extras=incoming.products.filter(p=>p.sku&&!seen.has(p.sku.toLowerCase()));
 const already=new Set(state.settings.banners.map(b=>b.id));
 const newBanners=incoming.settings.banners.filter(b=>b.image&&!already.has(b.id)).slice(0,Math.max(0,12-state.settings.banners.length));
 if(!extras.length&&!newBanners.length){alert(T('ملفك الحالي يحافظ على المنتجات والصور الموجودة. ما في عناصر جديدة لإضافتها؛ لم يتغيّر شيء.','Current catalog is unchanged: no new products or banners to add.'));return;}
 if(!confirm(T(`سيُضاف ${extras.length} منتج و${newBanners.length} صورة واجهة من الملف القديم، من دون تغيير أو حذف أي منتج حالي. متابعة؟`,`Add ${extras.length} products and ${newBanners.length} banners without changing or deleting existing records?`)))return;
 state.products.push(...extras);
 state.settings.banners.push(...newBanners);
 for(const p of extras){if(p.category&&!state.settings.categories.includes(p.category))state.settings.categories.push(p.category)}
 
 await changed();start();goto('admin');
 note(T('تم ضمّ البيانات الجديدة بدون مسح القديم. نزّل أحدث نسخة مالك أيضاً.','New records added without replacing old ones. Save your latest owner copy.'));
}

 else if(siblings.length && siblings[siblings.length-1]!==d.frame.previousElementSibling){list.appendChild(d.frame);d.changed=true;}

// V42: automatically target whichever catalogue section the owner was viewing,
// not the header at the top of the document.
let pp42EntryScrollY=0;
function pp42ClosestVisibleSection(){
 if(window.scrollY<110)return '@header';
 const top=105,bottom=Math.max(top+40,window.innerHeight-100),focus=(top+bottom)/2;
 const visible=Array.from(document.querySelectorAll('#app .pp-live-frame')).map(node=>({id:node.dataset.liveId,r:node.getBoundingClientRect()}));
 const footer=document.querySelector('#app .pp39-footer');
 if(footer)visible.push({id:'@footer',r:footer.getBoundingClientRect()});
 // If no section overlaps the viewport, the user is in the top header area.
 const crossing=visible.filter(v=>v.r.bottom>top&&v.r.top<bottom);
 if(!crossing.length)return window.scrollY<110?'@header':(visible.sort((a,b)=>Math.abs(a.r.top-focus)-Math.abs(b.r.top-focus))[0]?.id||'@header');
 const nearest=crossing.sort((a,b)=>{
  const da=Math.abs(Math.max(a.r.top,top)+Math.min(a.r.bottom,bottom)-2*focus);
  const db=Math.abs(Math.max(b.r.top,top)+Math.min(b.r.bottom,bottom)-2*focus);
  return da-db;
 })[0];
 return nearest?.id||'@header';
}

function pp46SetField(field,value){const s=ppLiveSection();if(!s||s.type!=='showcase')return;
 if(PP46_NUM_FIELDS.has(field)){
  const bounds={width:[20,100],pp46ImageHeight:[0,1200],pp46DescWidth:[25,100],pp46DescHeight:[0,1000],pp46DescSize:[9,48],pp46DescWeight:[400,800],pp46AutoSeconds:[2,15]};

function pp40Sync(){
 if(!pp40Open)return;
 const root=document.getElementById('pp40-studio');if(!root)return;
 const ids=pp40Parts();if(!ids.some(p=>p.id===pp40MainSelected())){pp40Active='@header';ppLiveSelectedId='@header';}
 const nav=root.querySelector('#pp40-choose');const navScroll=nav?.scrollLeft||0;
 if(nav){nav.innerHTML=ids.map((p,i)=>{
   const normal=`<button type="button" data-pp40-part="${esc(p.id)}" aria-pressed="${p.id===pp40MainSelected()}">${p.ico} ${esc(p.name)}</button>`;
   // A plus symbol after the header or a visible section inserts an independent block right there.
   const canInsert=p.id==='@header'||(p.id!=='@footer'&&!p.hidden);
   return normal+(canInsert?`<button type="button" class="pp47-inline-plus" data-pp47-insert-after="${esc(p.id)}" title="إضافة قسم بعد هذا القسم" aria-label="إضافة قسم بعد ${esc(p.name)}">＋</button>`:'');
 }).join('');nav.scrollLeft=navScroll;const paste= root.querySelector('[data-pp40-action="block-paste"]');if(paste)paste.disabled=!pp47Clipboard;}
 const seq=root.querySelector('#pp48-sequence');if(seq)pp48RenderSequence(seq);
 const controls=root.querySelector('#pp40-controls');if(!controls)return;
 if(pp40Active==='@footer'){
    document.querySelectorAll('body > #pp-live-dock').forEach(x=>x.remove());
    controls.innerHTML=pp40FooterEditor();
  }else if(ppLiveSection()?.type==='showcase'){
    document.querySelectorAll('body > #pp-live-dock').forEach(x=>x.remove());
    controls.innerHTML=pp46ShowcaseEditor(ppLiveSection());
  }else{
   let dock=document.getElementById('pp-live-dock');
   if(!dock){const div=document.createElement('div');div.innerHTML=ppLiveDockHtml();dock=div.firstElementChild;}
   controls.innerHTML='';controls.appendChild(dock);
   if(pp40Active==='@header'||pp40Active.startsWith('@icon:')){ /* all header controls use existing editor */ }
   else {const s=ppLiveSection();if(s?.type==='slider')controls.insertAdjacentHTML('afterbegin',pp43SliderEditor());
    if(s&&['products','new'].includes(s.type))controls.insertAdjacentHTML('afterbegin',pp43ProductsEditor());}
 }
 const label=root.querySelector('#pp40-preview-name');if(label)label.textContent='👁 '+pp40SelectedTitle();
 const setLabel=root.querySelector('#pp40-settings-title');if(setLabel)setLabel.textContent='⚙️ إعدادات: '+pp40SelectedTitle();
 pp40Preview();
}
function pp40AfterRender(){if(pp40Open)pp40Sync();}
function pp40AfterSelect(){if(!pp40Open)return; if(ppLiveSelectedId!=='@footer')pp40Active=ppLiveSelectedId; pp40Sync();}
function pp40Preview(){
 if(!pp40Open)return;
 const stage=document.getElementById('pp40-preview-scaler'),area=document.getElementById('pp40-preview-area'),track=document.getElementById('pp41-preview-track');
 if(!stage||!area||!track)return;
 let target=null;
 if(pp40Active==='@footer'&&state.settings.footerVisible!==false)target=document.querySelector('#app .pp39-footer');
 else if(pp40MainSelected()==='@header')target=document.querySelector('#app .v12-header');
 else target=Array.from(document.querySelectorAll('#app .pp-live-frame')).find(el=>el.dataset.liveId===pp40MainSelected());
 let oldScroll=area.scrollTop;
 stage.innerHTML='';
 area.classList.toggle('pp41-expanded',pp41Expanded);
 area.classList.toggle('pp41-whole',pp41FullFit);
 const fitBtn=document.querySelector('[data-pp41-action="fit"]'),expandBtn=document.querySelector('[data-pp41-action="expand"]');
 if(fitBtn){fitBtn.textContent=pp41FullFit?'🔍 ملء العرض':'🔎 عرض الشريحة كاملة';fitBtn.setAttribute('aria-pressed',String(pp41FullFit));}
 if(expandBtn){expandBtn.textContent=pp41Expanded?'⊟ تصغير':'⛶ تكبير';expandBtn.setAttribute('aria-pressed',String(pp41Expanded));}
 if(!target){
  track.style.height='65px';stage.style.width='100%';stage.style.height='auto';stage.style.transform='translateX(-50%)';
  stage.innerHTML='<div id="pp40-preview-empty">هذا القسم مخفي أو غير ظاهر حالياً. أظهره من إعدادات القسم.</div>';
  return;
 }
 const rect=target.getBoundingClientRect(),w=Math.max(100,rect.width||area.clientWidth),h=Math.max(48,rect.height||140);
 const node=target.cloneNode(true);
 node.querySelectorAll('[id]').forEach(x=>x.removeAttribute('id'));
 node.removeAttribute('id');node.removeAttribute('data-live-id');
 node.querySelectorAll('[data-live-grip],#pp28-header-grip').forEach(x=>x.remove());
 node.querySelectorAll('[contenteditable]').forEach(x=>x.removeAttribute('contenteditable'));
 node.style.cssText+=';width:'+w+'px!important;min-height:0!important;margin:0!important;position:relative!important;top:0!important;transform:none!important;';
 // Preserve carousel styling dependencies in the isolated preview, not the original store.
 stage.classList.toggle('pp24-home',!!node.querySelector('.hero-carousel'));
 const hero=node.querySelector('.hero-carousel');if(hero)hero.id='hero-carousel';
 stage.style.width=w+'px';stage.style.height=h+'px';stage.appendChild(node);
 const usableW=Math.max(100,area.clientWidth-14),usableH=Math.max(90,area.clientHeight-14);
 const scale=Math.max(.06,Math.min(1,usableW/w,pp41FullFit?usableH/h:1));
 stage.style.transform=`translateX(-50%) scale(${scale})`;
 track.style.height=Math.max(70,Math.ceil(h*scale+14))+'px';
 // Keep the preview position when editing text or colors; only change it on section switch.
 if(oldScroll>0&&!pp41FullFit)area.scrollTop=oldScroll;
 const status=document.getElementById('pp40-status');
 if(status)status.textContent=pp41FullFit?'✅ الشريحة كاملة في الإطار — اضغط «ملء العرض» لتشوف التفاصيل بحجم أكبر':'👁 معاينة واضحة بعرض الهاتف — اسحب داخل الصورة للأعلى والأسفل لمشاهدة الباقي';
}

    s.type==='products'?'📦 منتجات ('+(s.count||0)+' / السطر)':(pp24Types()[s.type]?.icon||'▣')+' '+(pp24Types()[s.type]?.name||s.type);
 const selected=pp40MainSelected();
 const wasExpanded=root.querySelector('details')?.open;
 root.innerHTML=`<details class="pp48-outline" ${wasExpanded!==false?'open':''}><summary>☷ ترتيب الأقسام + إضافة بين كل سطرين <small>${rows.length} قسم</small></summary>
  <p class="pp48-hint">اسحب ☷ بإصبعك لنقل أي قسم، أو اضغط + لإضافة قسم جديد مكانه. كل قسم مستقل.</p>
  <button class="pp48-between" type="button" data-pp48-insert="@header">＋ إضافة قسم في أول الصفحة</button>
  ${rows.map(s=>`<div class="pp48-sort-row ${s.id===selected?'pp48-selected':''}" data-pp48-row="${esc(s.id)}">
    <button class="pp48-grip" type="button" data-pp48-grip="${esc(s.id)}" aria-label="اسحب لترتيب القسم">☷</button>
    <button class="pp48-row-name" type="button" data-pp48-select="${esc(s.id)}">${name(s)}${s.visible===false?' (مخفي)':''}</button>
    <button class="pp48-copy" type="button" data-pp48-copy="${esc(s.id)}" title="نسخ القسم">⧉</button>
    <button class="pp48-copy" type="button" data-pp48-paste="${esc(s.id)}" title="لصق بعد القسم" ${!pp47Clipboard?'disabled':''}>📋</button>
   </div><button class="pp48-between" type="button" data-pp48-insert="${esc(s.id)}">＋ إضافة بعد هذا القسم</button>`).join('')}
 </details>`;
}
function pp48MoveBlock(from,to){
 if(from===to||!from||!to)return;
 const rows=state.settings.homeSections,fromIndex=rows.findIndex(s=>s.id===from),toIndex=rows.findIndex(s=>s.id===to);
 if(fromIndex<0||toIndex<0)return;
 ppLiveSnapshot();rows.splice(toIndex,0,rows.splice(fromIndex,1)[0]);
 ppLiveMark();render();pp40Sync();
 note('تم نقل القسم وحفظ ترتيب الواجهة');
}
document.addEventListener('click',e=>{
 if(!pp40Open||!visibleAdmin())return;
 const el=e.target.closest('[data-pp48-insert],[data-pp48-select],[data-pp48-copy],[data-pp48-paste]');if(!el)return;
 e.preventDefault();e.stopImmediatePropagation();
 if(el.hasAttribute('data-pp48-select')){pp40Choose(el.dataset.pp48Select);return;}
 if(el.hasAttribute('data-pp48-copy')){
  const sec=state.settings.homeSections.find(s=>s.id===el.dataset.pp48Copy);if(!sec)return;
  pp47Clipboard=pp24Clone(sec);pp40Sync();note('تم نسخ هذا القسم، اضغط 📋 بعد أي قسم للصقه');return;
 }
 if(el.hasAttribute('data-pp48-paste')){
  if(!pp47Clipboard)return;
  pp47InsertAfterId=el.dataset.pp48Paste;pp47PasteBlock();return;
 }
 if(el.hasAttribute('data-pp48-insert')){
  pp47InsertAfterId=el.dataset.pp48Insert||'@header';
  document.querySelector('#pp40-add-choices')?.remove();pp40AddSection();return;
 }
},true);
const pp48Drag={id:null,target:null,pointerId:null};
document.addEventListener('pointerdown',e=>{
 if(!pp40Open||!visibleAdmin())return;
 const handle=e.target.closest('[data-pp48-grip]');if(!handle)return;
 e.preventDefault();pp48Drag.id=handle.dataset.pp48Grip;pp48Drag.target=null;pp48Drag.pointerId=e.pointerId;
 try{handle.setPointerCapture(e.pointerId);}catch(_){}
 handle.closest('.pp48-sort-row')?.classList.add('pp48-dragging');
},true);
document.addEventListener('pointermove',e=>{
 if(!pp48Drag.id||e.pointerId!==pp48Drag.pointerId)return;
 e.preventDefault();
 document.querySelectorAll('.pp48-drop-target').forEach(el=>el.classList.remove('pp48-drop-target'));
 const node=document.elementFromPoint(e.clientX,e.clientY)?.closest('.pp48-sort-row');
 if(node&&node.dataset.pp48Row!==pp48Drag.id){node.classList.add('pp48-drop-target');pp48Drag.target=node.dataset.pp48Row;}
},true);
document.addEventListener('pointerup',e=>{
 if(!pp48Drag.id||e.pointerId!==pp48Drag.pointerId)return;
 e.preventDefault();const from=pp48Drag.id,to=pp48Drag.target;
 pp48Drag.id=null;pp48Drag.target=null;pp48Drag.pointerId=null;
 document.querySelectorAll('.pp48-drop-target,.pp48-dragging').forEach(el=>el.classList.remove('pp48-drop-target','pp48-dragging'));
 if(to)pp48MoveBlock(from,to);
},true);
document.addEventListener('pointercancel',()=>{pp48Drag.id=null;pp48Drag.target=null;pp48Drag.pointerId=null;},true);

function pp47InsertionIndex(anchor){
  const rows=state.settings.homeSections;
  if(anchor==='@header')return 0;
  if(anchor==='@footer')return rows.length;
  const i=rows.findIndex(s=>s.id===anchor);
  return i<0?rows.length:i+1;
}
function pp47AddBlock(type,cols=0){

 pp24Ensure();if(state.settings.homeSections.length>=500){note('الحد الأعلى 500 قسم');return;}
 const insertAt=pp47InsertionIndex(pp47InsertAfterId||pp40MainSelected());
 const normalizedType=type==='slider'||type==='image'?'showcase':type;
 const sec=pp24Seed(normalizedType);
 if(type==='slider'){sec.pp46Mode='slider';sec.pp46Slides=[];sec.pp46ImageHeight=180;sec.title='';sec.subtitle='';}
 if(type==='image'){sec.pp46Mode='single';sec.pp46Slides=[];sec.pp46ImageHeight=190;sec.title='';sec.subtitle='';}
 if(sec.type==='text'){sec.title='';sec.subtitle='اكتب الوصف هنا';sec.padding=12;sec.fontSize=16;}
 if(cols>=1&&cols<=5&&sec.type==='products'){
   sec.columns=cols;sec.count=cols;sec.pp45RowPattern=String(cols);sec.title='';sec.scrollGridHeight=0;
 }
 ppLiveSnapshot();state.settings.homeSections.splice(insertAt,0,sec);
 pp47InsertAfterId=null;ppLiveSelectedId=sec.id;pp40Active=sec.id;
 ppLiveMark();render();pp40Choose(sec.id);
 note('تمت إضافة قسم مستقل، ويمكن تعديل حجمه ومحتواه');
}

/* V49: one-touch storefront layout editing; independent rows, slides and SKU sequences. */
function pp49SeqInfo(prefix){
 prefix=String(prefix||'PP-').trim()||'PP-';
 let found=0,pad=4;
 for(const p of state.products){const code=String(p.productCode||p.sku||'');if(!code.startsWith(prefix))continue;
  const tail=code.slice(prefix.length);if(!/^\d+$/.test(tail))continue;
  if(+tail>=found){found=Math.max(found,+tail);pad=Math.max(pad,Math.min(9,tail.length));}
 }
 const tracker=Number(state.settings.pp49Sequences?.[prefix])||0;
 const last=Math.max(found,tracker);
 return {last,pad,next:prefix+String(last+1).padStart(pad,'0')};
}
function pp49NextCode(prefix){return pp49SeqInfo(prefix).next}
function pp49CodeRefresh(initial=false){
 const f=document.getElementById('product-form');if(!f)return;
 const sel=f.querySelector('#pp49-code-mode'),prefixEl=f.querySelector('#pp49-code-prefix'),code=f.querySelector('#pp49-product-code');
 if(!sel||!prefixEl||!code)return;
 const mode=sel.value,pre=prefixEl.value.trim()||'PP-',info=pp49SeqInfo(pre);
 const hint=f.querySelector('#pp49-code-hint');
 hint.textContent=`السلسلة ${pre} | آخر رقم: ${info.last?pre+String(info.last).padStart(info.pad,'0'):'لا يوجد'} | التالي: ${info.next}`;
 if(mode==='auto'){
  if(!editId || code.value==='' || !initial){
   const existing=state.products.find(p=>p.id===editId);
   code.value=existing&&initial?(existing.productCode||existing.sku||info.next):info.next;
  }
  code.readOnly=true;
 }else code.readOnly=false;
 const duplicate=state.products.some(p=>p.id!==editId&&String(p.productCode||p.sku||'').toLowerCase()===code.value.trim().toLowerCase());
 const warn=f.querySelector('#pp49-duplicate-warning');warn.textContent=duplicate?'⚠️ هذا الكود موجود مسبقاً — اكتب كوداً آخر':'';
}
document.addEventListener('input',e=>{
 if(e.target.matches('#pp49-product-code,#pp49-code-prefix'))pp49CodeRefresh(e.target.id!=='pp49-code-prefix');
},true);

}

/* V50: artwork recommendations based on section type and owner-set frame geometry.
   Artwork pixels are exported design sizes; the display width is fluid across devices. */
function pp50SizeSpec(s){
  const pct=Math.max(20,Math.min(100,Number(s.width??100)||100));
  const frame=Math.max(240,Math.min(1000,(Math.min(window.innerWidth||390,1040)-24)*pct/100));
  const scaled=height=>Math.max(250,Math.min(2500,Math.round(1600*height/frame)));
  let width=1600,height=900,detail='كل شريحة بصورة مستقلة';
  if(s.type==='showcase' && s.pp50ImagesPerRow){
    const n=Math.max(2,Math.min(4,Number(s.pp50ImagesPerRow)||2));
    width=1200;height=1200;detail=`لكل صورة من الصور الـ ${n} — مربعة، جنباً إلى جنب`;
  }else if(s.type==='showcase'){
    const h=Number(s.pp46ImageHeight??0);
    height=h>0?scaled(h):900;
    detail=s.pp46Mode==='slider'?'لكل شريحة من السلايدر':'للصورة العريضة الواحدة';
  }else if(s.type==='slider'){
    const h=Number(state.settings.sliderCompactHeight)||Number(s.height)||0;
    height=h>0?scaled(h):900;detail='لكل صورة في سلايدر الواجهة الأصلي';
  }else if(s.type==='image'){
    const h=Number(s.height)||0;height=h>0?scaled(h):900;detail='للصورة العريضة الواحدة';
  }else if(s.type==='brand'){
    height=470;detail='لصورة واجهة الشركة العريضة';
  }else if(['products','new'].includes(s.type)){
    const d=pp50ProductImageSpec(s.pp49Cols||s.columns||2);width=d.w;height=d.h;detail=`صورة لكل منتج؛ ${s.pp49Cols||s.columns||2} خانات في هذا السطر`;
  }else{
    return {image:false,section:`عرض القسم: ${pct}% · الارتفاع: ${Number(s.height)>0?s.height+' px':'تلقائي'}`};
  }
  const gcd=(a,b)=>b?gcd(b,a%b):a;
  const g=gcd(width,height);
  return {image:true,width,height,ratio:`${width/g}:${height/g}`,detail,section:`عرض القسم ${pct}% · ${s.type==='showcase'&&s.pp50ImagesPerRow?'كل صورة مربعة 1:1':('ارتفاع '+(s.type==='showcase'?(Number(s.pp46ImageHeight)>0?s.pp46ImageHeight+'px':'تلقائي 16:9'):(Number(s.height)>0?s.height+'px':'حسب العرض')))}`};
}

 return `<div class="pp50-size-card" data-pp50-size-card aria-live="polite"><div class="pp50-size-label">📐 ${d.image?'مقاس الصورة المقترح للتصميم':'مقاس هذا القسم'}</div>
   ${d.image?`<div class="pp50-dim">${d.width} × ${d.height} px</div><div class="pp50-size-sub"><b>${d.detail}</b> <span class="pp50-size-ratio">${d.ratio}</span></div>`:'<div class="pp50-size-sub"><b>هذا القسم لا يحتاج ملف صورة.</b></div>'}
   <div class="pp50-size-sub">${d.section}. ${d.image?'ابعث لي هذا المقاس عند طلب تصميم الصورة.':''}</div></div>`;

function pp50ProductImageSpec(cols){

function pp52QuickProduct(name,price,photo){
  const prefix=String(state.settings.pp49ActivePrefix||'PP-').trim()||'PP-';
  const productCode=pp49NextCode(prefix);
  const m=productCode.slice(prefix.length).match(/^\\d+$/);
  state.settings.pp49Sequences=state.settings.pp49Sequences||{};
  if(m)state.settings.pp49Sequences[prefix]=Math.max(Number(m[0]),Number(state.settings.pp49Sequences[prefix])||0);
  return {id:id(),demoOnly:false,createdAt:Date.now(),nameAr:name,nameEn:'',sku:productCode,productCode,
   pp49CodeMode:'auto',pp49CodePrefix:prefix,barcode:'',category:'',brand:'',model:'',currency:'USD',
   price:price===''?null:Number(price),stock:null,specs:'',descriptionAr:'',descriptionEn:'',
   images:photo?[photo]:[],photoBg:'',cardBg:'',pp45RowCols:0,relatedIds:[],active:true,
   visibility:{showName:true,showPrice:true,showDesc:true,showCode:false,showCategory:false,showBrandModel:false,showSpecs:false}};
}

async function ppUpload(dataUrl,folder){
  const m=/^data:(image\/[a-z+]+);base64,/i.exec(dataUrl);if(!m)return dataUrl;
  const mime=m[1].toLowerCase(),ext=mime.split('/')[1].replace('jpeg','jpg').replace('svg+xml','svg');
  const bin=atob(dataUrl.slice(m[0].length)),u8=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
  const name=folder+'/'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
  await ppEnsureToken();
  await ppFetch('/storage/v1/object/'+PP_BUCKET+'/'+name,{method:'POST',headers:{'Content-Type':mime,'x-upsert':'true','cache-control':'max-age=31536000'},body:u8});
  return PP_PUB+name;

  }catch(e){
    if(e.guard){ppLS.del(PP_DIRTY_KEY);ppSetSync('error',e.message);}
    else{ppSetSync(navigator.onLine===false?'offline':'error',e.message);clearTimeout(ppPushTimer);ppPushTimer=setTimeout(ppPush,20000);}
  }finally{
    ppPushing=false;if(ppPushAgain){ppPushAgain=false;ppSchedulePush(500);}
  }
}
/* ---- owner login / logout (replaces the old local password lock) ---- */
function ownerGate(){
  if(!MANAGER)return;pp43LoginOriginY=window.scrollY;
  if(ownerUnlocked){preview=false;goto('theme');return;}
  modal(T('دخول المالك','Owner login'),`<div class="pp-dev-login"><label>${T('البريد الإلكتروني','Email')}<input type="email" id="pp-dev-email" autocomplete="username" inputmode="email" placeholder="you@example.com"></label><label>${T('كلمة المرور','Password')}<input type="password" id="pp-dev-pass" autocomplete="current-password"></label><small>${T('الدخول عبر حساب آمن على السيرفر. التعديلات تنحفظ أونلاين وتظهر للزبائن.','Secure server login. Changes are saved online.')}</small><button class="btn gold" type="button" data-action="dev-unlock">${T('دخول','Log in')}</button></div>`,`<button type="button" class="btn" data-action="close-modal">${T('إلغاء','Cancel')}</button>`);
}
async function ownerAuthorize(){
  const email=($('pp-dev-email')?.value||'').trim(),pass=$('pp-dev-pass')?.value||'';
  if(!email||!pass){note(T('اكتب الإيميل وكلمة المرور','Enter email and password'));return;}
  try{
    const j=await ppAuth('password',{email,password:pass});
    ppSaveSession({...j,email});
    if(!(await ppIsAdmin())){ppSaveSession(null);note(T('هذا الحساب غير مسموح له بإدارة المتجر','This account is not an admin'));return;}
    ownerUnlocked=true;preview=false;ppLiveMode=false;
    await ppLoadRemote();
  }catch(e){ppSaveSession(null);ownerUnlocked=false;note(T('تعذّر الدخول: ','Login failed: ')+e.message);return;}
  closeModal();start();ppSetSync('saved');
}
async function ppSignOut(){
  ppSaveSession(null);ppLS.del(PP_CACHE_KEY);ppLS.del(PP_DIRTY_KEY);
  const el=document.getElementById('pp53-sync');if(el)el.hidden=true;
  try{await ppLoadRemote({render:true});}catch(e){}
}
/* ---- customer: "new products" notice ---- */
let ppOnlyNew=false;
function ppNewDays(){const d=Number(state.settings&&state.settings.newDays);return d>0?d:3;}
function ppNewest(){return state.products.filter(ppIsNew).reduce((m,p)=>Math.max(m,Number(p.createdAt)||0),0);}
function ppHasDot(){return ppNewest()>Number(ppLS.get(PP_SEEN_KEY)||0);}
function ppIsNew(p){return !!p&&p.active!==false&&(Number(p.createdAt)||0)>Date.now()-ppNewDays()*864e5;}
function ppNewBadge(p,html){
  if(p.stock===0)html=html.replace(/data-action="add-cart"/g,'data-action="add-cart" disabled aria-disabled="true"');
  if(!ppIsNew(p))return html;
  return html.replace('>','><span class="pp-new-badge">'+T('جديد','New')+'</span>');
}
/* out-of-stock items (stock = 0) cannot be added to the basket from any screen */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action="add-cart"]');if(!el)return;
  const p=state.products.find(x=>String(x.id)===String(el.dataset.id));
  if(p&&p.stock===0){e.stopImmediatePropagation();e.preventDefault();note(T('هذا المنتج غير متوفر حالياً — تواصل معنا عبر واتساب للاستفسار','Out of stock — contact us on WhatsApp'));}
},true);
/* ---- header "New" chip (customer + owner preview) ---- */
let ppChipT=0;
function ppEnsureChip(){
  const cart=document.querySelector('[data-pp29-item="cart"]');
  let chip=document.getElementById('pp56-new'),gear=document.getElementById('pp56-days');
  const n=state.products.filter(ppIsNew).length;
  if(!cart||!n){if(chip)chip.remove();}
  else{
    if(!chip){chip=document.createElement('button');chip.id='pp56-new';chip.type='button';chip.setAttribute('data-action','pp56-new');}
    const dot=ppHasDot();const key=(ppOnlyNew?'x':'n')+n+lang+(dot?'d':'');
    if(chip.dataset.k!==key){chip.dataset.k=key;chip.className=(ppOnlyNew?'pp56-on ':'')+(dot?'pp56-dot':'');chip.innerHTML='<i>'+(ppOnlyNew?'✕':'🔔')+'</i>'+T('جديد','New')+'<b>'+n+'</b>';chip.setAttribute('aria-label',T('المنتجات الجديدة','New products'));}
    if(chip.previousElementSibling!==cart)cart.insertAdjacentElement('afterend',chip);
  }
  const showGear=MANAGER&&ownerUnlocked&&!preview&&cart;
  if(!showGear){if(gear)gear.remove();}
  else{
    if(!gear){gear=document.createElement('button');gear.id='pp56-days';gear.type='button';gear.setAttribute('data-action','pp56-days');gear.textContent='⏱';gear.title=T('مدة ظهور "جديد"','"New" duration');}
    const anchor=document.getElementById('pp56-new')||cart;
    if(anchor.nextElementSibling!==gear)anchor.insertAdjacentElement('afterend',gear);
  }
}
new MutationObserver(()=>{if(ppChipT)return;ppChipT=setTimeout(()=>{ppChipT=0;try{ppEnsureChip()}catch(e){}},60);}).observe(document.body,{childList:true,subtree:true});
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
  if(a==='pp56-new'){
    e.stopImmediatePropagation();e.preventDefault();
    ppOnlyNew=!ppOnlyNew;
    if(ppOnlyNew){
      const nw=ppNewest();if(nw)ppLS.set(PP_SEEN_KEY,String(nw));
      const all=state.products.filter(p=>p.active!==false).reduce((m,p)=>Math.max(m,Number(p.createdAt)||0),0);
      const ds=all?new Date(all).toLocaleDateString(lang==='ar'?'ar-EG-u-nu-latn':'en-GB',{day:'2-digit',month:'2-digit',year:'numeric'}):'';
      note('📅 '+T('آخر تحديث للمنتجات: ','Last products update: ')+ds);
    }
    setMenu(false);pp24ShowAllProducts=true;cat='';q='';order='new';pg=1;assistantSearched=false;goto('catalog');
    setTimeout(ppEnsureChip,100);return;
  }
  if(a==='pp56-days'){
    e.stopImmediatePropagation();e.preventDefault();
    const v=window.prompt(T('كم يوماً تبقى علامة "جديد" وزر "جديد" ظاهرة للزبون؟ (مثال: 1 أو 2 أو 3 أو 7)','How many days should the "New" badge stay visible? (e.g. 1, 2, 3, 7)'),String(ppNewDays()));
    if(v===null)return;
    const d=Number(String(v).replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(',','.'));
    if(!(d>=0.5&&d<=90)){note(T('اكتب رقماً بين 0.5 و 90','Enter a number between 0.5 and 90'));return;}
    state.settings.newDays=d;
    try{await changed();}catch(err){}
    render();note(T('✅ صارت مدة "جديد" '+d+' يوم','✅ "New" now lasts '+d+' day(s)'));return;
  }
  if(/^(menu-all|menu-category|menu-new|pp24-all|pp24-home|search-go|quick-search|search-result|smart-submit)$/.test(a))ppOnlyNew=false;
},true);
function ppAnnounceNew(){}
async function ppRefreshCustomer(){
  if(MANAGER||document.hidden)return;
  try{
    const before=state.products.length,beforeEdit=JSON.stringify(state.products.map(p=>p.id+':'+p.createdAt+':'+p.price+':'+p.active));
    await ppLoadRemote();
    const after=JSON.stringify(state.products.map(p=>p.id+':'+p.createdAt+':'+p.price+':'+p.active));
    if(after!==beforeEdit){ppAnnounceNew();render();}
  }catch(e){}
}
/* ---- boot ---- */
async function ppBoot(){
  let cached=null;try{cached=JSON.parse(ppLS.get(PP_CACHE_KEY)||'null')}catch(e){}
  if(cached&&Array.isArray(cached.products))state=normalize(cached);
  if(MANAGER){
    try{const s=JSON.parse(ppLS.get(PP_SESSION_KEY)||'null');
      if(s&&s.refresh_token){ppSession=s;await ppEnsureToken();if(await ppIsAdmin())ownerUnlocked=true;else ppSaveSession(null);}
    }catch(e){/* offline or session expired: owner can log in again */}
  }
  start();
  try{
    await ppLoadRemote();
    if(MANAGER&&ownerUnlocked&&ppLS.get(PP_DIRTY_KEY)){
      // edits made while offline / before the last push finished: re-apply them on top of the server copy
      try{const local=await loadDB();if(local&&Array.isArray(local.products)&&Number(local.lastEdited)>0){state=normalize(local);ppSchedulePush(300);}}catch(e){}
    }
    ppAnnounceNew();
    start();
    if(MANAGER&&ownerUnlocked)ppSetSync('saved');
  }catch(e){
    if(MANAGER&&ownerUnlocked)ppSetSync('offline');
  }
  if(!MANAGER){
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)ppRefreshCustomer();});
    window.addEventListener('online',ppRefreshCustomer);
    setInterval(ppRefreshCustomer,120000);
  }
}

/* ---- owner: permanent delete (with confirmation) ---- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-action="pp53-delete"]');if(!b||!visibleAdmin())return;
  e.stopPropagation();
  const p=state.products.find(x=>x.id===b.dataset.id);if(!p)return;
  if(!confirm('حذف نهائي للمنتج «'+(p.nameAr||p.nameEn||p.sku)+'»؟ لا يمكن التراجع.'))return;
  state.products=state.products.filter(x=>x.id!==p.id);
  state.products.forEach(x=>{if(Array.isArray(x.relatedIds))x.relatedIds=x.relatedIds.filter(i=>i!==p.id);});
  (state.settings.homeSections||[]).forEach(s=>{if(Array.isArray(s.productIds))s.productIds=s.productIds.filter(i=>i!==p.id);});
  await changed();drawAdmin();note('✓ تم حذف المنتج');
},true);

ppBoot();
})();

</script>
